# Nightly ingest, stage 1 of 2, as a reusable workflow. A city repo's own ingest.yml holds only the
# schedule and calls this with its secrets:
#
#   jobs:
#     nightly:
#       uses: rhundhausen/weekend/.github/workflows/ingest.yml@main
#       with:
#         source: ${{ inputs.source }}
#       secrets: inherit
#
# It fetches every running source into the city's data/raw-events.json and commits that file alone
# to the branch it ran on. When the city's ingest run finishes, whether it succeeded or not, the
# city's refine workflow starts and turns the raw file into what the site reads. The github context
# here is the caller's (its event, schedule, and repository), and the engine is checked out into
# .engine/ beside the city's files.

name: ingest

on:
  workflow_call:
    inputs:
      source:
        description: Run only this source. Leave blank for all.
        type: string
        required: false
        default: ''
      hour:
        description: The hour in the city's time zone that a scheduled run is for. The caller schedules both UTC hours it can fall on (daylight saving), and the other run is skipped.
        type: number
        required: false
        default: 0

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: pwsh

jobs:
  when:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
      at: ${{ steps.check.outputs.at }}
    steps:
      - name: Check out the city
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: city.json
          sparse-checkout-cone-mode: false

      - name: Check out the engine
        uses: actions/checkout@v5
        with:
          repository: rhundhausen/weekend
          ref: main
          path: .engine
          fetch-depth: 1

      # A manual run always goes ahead. A scheduled run goes ahead only for the cron line that is
      # the target hour in the city's time zone (city.json), and passes the scheduled time on as
      # asOf so the site reads 12:00 AM however late the run started.
      - name: Check the city's time
        id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          HOUR: ${{ inputs.hour }}
        run: ./.engine/ingestion/scripts/Test-LocalHour.ps1 -Hour ([int]$env:HOUR)

  ingest:
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the city
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check out the engine
        uses: actions/checkout@v5
        with:
          repository: rhundhausen/weekend
          ref: main
          path: .engine
          fetch-depth: 1

      - name: Validate sources
        run: ./.engine/ingestion/scripts/Test-Sources.ps1

      # An unset repository secret expands to an empty string, so the adapters see it as unset.
      # The source input goes through env, not inline, so its text is never parsed as script.
      - name: Ingest
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SONGKICK_API_KEY: ${{ secrets.SONGKICK_API_KEY }}
          SOURCE: ${{ inputs.source }}
          SCHEDULED_AT: ${{ needs.when.outputs.at }}
        run: |
          $options = @{}
          $source = "$env:SOURCE".Trim()
          if ($source) { $options.Source = $source }
          if ($env:SCHEDULED_AT) { $options.AsOf = $env:SCHEDULED_AT }
          ./.engine/ingestion/scripts/Invoke-Ingest.ps1 @options

      - name: Upload raw output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: out
          path: out
          if-no-files-found: ignore

      # [skip ci], because the site doesn't read the raw file. Refine starts after this run and its
      # commit deploys.
      - name: Commit raw data
        run: ./.engine/ingestion/scripts/Publish-Data.ps1 -Path data/raw-events.json -Message 'data: raw ingest' -SkipDeploy

  # The summary email, in its own job because GitHub serves a job's log only once that job has
  # finished, and the email attaches the ingest job's log. Runs whatever ingest's outcome, so a
  # failed run is emailed too.
  report:
    needs: [when, ingest]
    if: always() && needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the city
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check out the engine
        uses: actions/checkout@v5
        with:
          repository: rhundhausen/weekend
          ref: main
          path: .engine
          fetch-depth: 1

      - name: Download raw output
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: out
          path: out

      # Never blocks the email: without logs, the email says so.
      - name: Save the job logs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: ./.engine/ingestion/scripts/Save-RunLogs.ps1

      # The address is a secret because the repo is public.
      - name: Email the report
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          JOB_STATUS: ${{ needs.ingest.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ inputs.source }}
        run: ./.engine/ingestion/scripts/Send-Report.ps1 -Kind ingest

      # The scheduled run at midnight Sunday, city time, also emails the weekly reminder to run
      # the local sources (sites that turn away GitHub's servers) from home. Other runs skip it.
      - name: Email the weekly local ingest reminder
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          SCHEDULED_AT: ${{ needs.when.outputs.at }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./.engine/ingestion/scripts/Send-LocalReminder.ps1
