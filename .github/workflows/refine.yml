# Nightly refine, stage 2 of 2, as a reusable workflow. A city repo's own refine.yml holds only the
# triggers (each completed ingest run, a pushed raw file, or by hand) and calls this:
#
#   jobs:
#     nightly:
#       uses: rhundhausen/weekend/.github/workflows/refine.yml@main
#       with:
#         skip_link_check: ${{ inputs.skip_link_check || false }}
#         skip_city_lookup: ${{ inputs.skip_city_lookup || false }}
#       secrets: inherit
#
# It reads the city's committed data/raw-events.json, merges and cleans it, checks event links, and
# commits the files the site reads, which deploys the site. It never fetches a source. The github
# context here is the caller's, and the core is checked out into .core/ beside the city's files.

name: refine

on:
  workflow_call:
    inputs:
      skip_link_check:
        description: Skip the link check (known link results still apply).
        type: boolean
        required: false
        default: false
      skip_city_lookup:
        description: Skip the city lookup for Other events (known cities still apply).
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  # To read the ingest run's jobs in the when job.
  actions: read

defaults:
  run:
    shell: pwsh

jobs:
  when:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check out the core
        uses: actions/checkout@v5
        with:
          repository: rhundhausen/weekend
          ref: main
          path: .core
          fetch-depth: 1
          sparse-checkout: ingestion/scripts/Test-IngestRan.ps1
          sparse-checkout-cone-mode: false

      # A manual run always goes ahead. After ingest, refine goes ahead if ingest's job started,
      # whatever its outcome, so a failed ingest still moves past events and checks links.
      - name: Check the ingest run
        id: check
        env:
          EVENT: ${{ github.event_name }}
          INGEST_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: ./.core/ingestion/scripts/Test-IngestRan.ps1

  refine:
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The link check stops itself after 15 minutes and the city lookup after 3; the rest takes
    # under a minute.
    timeout-minutes: 30
    steps:
      # The head of the branch, so it reads the raw file ingest just committed.
      - name: Check out the city
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check out the core
        uses: actions/checkout@v5
        with:
          repository: rhundhausen/weekend
          ref: main
          path: .core
          fetch-depth: 1

      # No API key secrets: refine requests only event pages and robots.txt, never a source API.
      # The inputs go through env, not inline, so their text is never parsed as script.
      - name: Refine
        env:
          SKIP_LINK_CHECK: ${{ inputs.skip_link_check }}
          SKIP_CITY_LOOKUP: ${{ inputs.skip_city_lookup }}
        run: |
          $options = @{}
          if ($env:SKIP_LINK_CHECK -eq 'true') { $options.SkipLinkCheck = $true }
          if ($env:SKIP_CITY_LOOKUP -eq 'true') { $options.SkipCityLookup = $true }
          ./.core/ingestion/scripts/Invoke-Refine.ps1 @options

      - name: Upload refine output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: refine-out
          path: out
          if-no-files-found: ignore

      - name: Commit data
        run: |
          $paths = 'data/events.json', 'data/archive', 'data/links.json', 'data/city-lookup.json', 'data/meta.json'
          ./.core/ingestion/scripts/Publish-Data.ps1 -Path $paths -Message 'data: nightly refine'

  # The summary email, in its own job because GitHub serves a job's log only once that job has
  # finished, and the email attaches the refine job's log. Runs whatever refine's outcome, so a
  # failed run is emailed too. These are the only secrets refine uses.
  report:
    needs: [when, refine]
    if: always() && needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the city
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Check out the core
        uses: actions/checkout@v5
        with:
          repository: rhundhausen/weekend
          ref: main
          path: .core
          fetch-depth: 1

      - name: Download refine output
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: refine-out
          path: out

      # Never blocks the email: without logs, the email says so.
      - name: Save the job logs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: ./.core/ingestion/scripts/Save-RunLogs.ps1

      - name: Email the report
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          JOB_STATUS: ${{ needs.refine.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: ./.core/ingestion/scripts/Send-Report.ps1 -Kind refine
