# Hugo theme config: the core repo is the theme for every city's site. website/site.toml is the
# site config (title from city.json, the city's data mounts), and website/build.sh builds the city's site with this
# repo as its theme (--themesDir <this repo's parent> --theme <this repo's folder>). A city file at
# the same path as one here (a layout, assets/css/skyline.css, a static icon) replaces it.
# The ingestion scripts do not read this file.
[module]
  [[module.mounts]]
    source = 'website/content'
    target = 'content'
  [[module.mounts]]
    source = 'website/layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'website/assets'
    target = 'assets'
  [[module.mounts]]
    source = 'website/data'
    target = 'data'
  [[module.mounts]]
    source = 'website/static'
    target = 'static'
  # Categories, tags, and title case. The city's additions are in its data/schema/.
  [[module.mounts]]
    source = 'ingestion/vocabulary'
    target = 'data/vocabulary'
